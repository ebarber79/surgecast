<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>surgecast handheld: physical layout</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="40" y="30" font-size="18" font-weight="bold" fill="#111">surgecast handheld guide · physical layout (side view, sketch)</text>

  <!-- airflow from the fan -->
  <g stroke="#1565c0" stroke-width="2" marker-end="url(#arr)">
    <line x1="960" y1="120" x2="870" y2="120"/>
    <line x1="960" y1="160" x2="870" y2="160"/>
    <line x1="960" y1="200" x2="870" y2="200"/>
  </g>
  <text x="915" y="100" text-anchor="middle" fill="#1565c0" font-weight="bold">wind from the fan</text>

  <!-- body (Pi + power bank) -->
  <rect x="300" y="250" width="260" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="285" text-anchor="middle" font-weight="bold" fill="#1b5e20">body: Raspberry Pi 5</text>
  <text x="430" y="303" text-anchor="middle" font-size="11">+ power bank stacked underneath</text>
  <text x="430" y="321" text-anchor="middle" font-size="11">vent the Pi's heat backward</text>
  <!-- IMU on the body, center -->
  <rect x="400" y="335" width="60" height="26" rx="4" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="430" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">IMU</text>

  <!-- handle with motor -->
  <rect x="380" y="370" width="70" height="180" rx="20" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <circle cx="415" cy="430" r="16" fill="#fffde7" stroke="#111" stroke-width="2"/>
  <text x="415" y="435" text-anchor="middle" font-weight="bold" font-size="12">M</text>
  <text x="415" y="575" text-anchor="middle" font-size="12">handle</text>

  <!-- forward boom with gas sensor -->
  <rect x="560" y="296" width="230" height="14" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <rect x="790" y="276" width="60" height="54" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="820" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">BME</text>
  <text x="820" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">688</text>
  <text x="820" y="350" text-anchor="middle" font-size="11">open to the air,</text>
  <text x="820" y="364" text-anchor="middle" font-size="11">upwind of the Pi</text>

  <!-- mast with vane -->
  <rect x="424" y="120" width="12" height="130" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <rect x="408" y="112" width="44" height="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="352" y="122" text-anchor="end" font-size="11" fill="#4a148c" font-weight="bold">AS5600 (under magnet)</text>
  <line x1="356" y1="118" x2="406" y2="118" stroke="#6a1b9a" stroke-width="1"/>
  <!-- shaft + magnet + vane -->
  <line x1="430" y1="112" x2="430" y2="70" stroke="#111" stroke-width="3"/>
  <rect x="423" y="102" width="14" height="8" fill="#9e9e9e" stroke="#111"/>
  <!-- vane: nose points into the wind (right), tail fin trails downwind (left) -->
  <line x1="360" y1="80" x2="500" y2="80" stroke="#111" stroke-width="3"/>
  <polygon points="500,73 518,80 500,87" fill="#111"/>
  <polygon points="360,80 330,55 318,55 340,80 318,105 330,105" fill="#ffccbc" stroke="#111" stroke-width="1.5"/>
  <text x="520" y="62" font-size="11">vane nose points into the wind</text>
  <text x="280" y="50" font-size="11" text-anchor="middle">tail fin</text>

  <!-- forward axis -->
  <line x1="470" y1="430" x2="760" y2="430" stroke="#111" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrk)"/>
  <text x="770" y="435" font-weight="bold">forward</text>
  <text x="470" y="455" font-size="12" font-weight="bold">forward = heading 0°, vane 0°</text>
  <text x="470" y="473" font-size="11">point the boom where you're walking;</text>
  <text x="470" y="489" font-size="11">calibrate the vane and IMU zero to this axis</text>

  <!-- notes -->
  <g font-size="12" fill="#222" transform="translate(0,80)">
    <text x="40" y="520" font-weight="bold">Why it's laid out this way</text>
    <text x="40" y="540">• Gas sensor on a ~20 cm forward boom: sampling air before the body and your hand disturb it, and away from the Pi's heat.</text>
    <text x="40" y="558">• Vane on a mast above everything, so it reads the free stream, not the wake of the body or your arm.</text>
    <text x="40" y="576">• IMU rigid on the body, aligned with the forward axis; gyro-only mode, so the vane magnet can't upset it.</text>
    <text x="40" y="594">• Vibration motor in the handle: cues are felt instantly, which matters more than sensor speed (see hardware.md).</text>
  </g>
</svg>
