<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>surgecast handheld: wiring schematic</title>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="40" y="30" font-size="18" font-weight="bold" fill="#111">surgecast handheld guide · wiring schematic (sketch)</text>

  <!-- Raspberry Pi 5 -->
  <rect x="40" y="200" width="200" height="270" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="140" y="228" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b5e20">Raspberry Pi 5</text>
  <text x="140" y="246" text-anchor="middle" font-size="11" fill="#33691e">40-pin header (I²C bus 1)</text>
  <g font-size="12" fill="#111" text-anchor="end">
    <text x="232" y="284">pin 1 · 3V3</text>
    <text x="232" y="324">pin 3 · GPIO2 SDA</text>
    <text x="232" y="364">pin 5 · GPIO3 SCL</text>
    <text x="232" y="404">pin 6 · GND</text>
  </g>
  <text x="140" y="455" text-anchor="middle" font-size="11" fill="#33691e">USB-C power in</text>

  <!-- Power bank -->
  <rect x="40" y="530" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="140" y="552" text-anchor="middle" font-weight="bold">USB-C power bank</text>
  <text x="140" y="570" text-anchor="middle" font-size="11">5 V, ≥ 3 A</text>
  <line x1="140" y1="530" x2="140" y2="472" stroke="#555" stroke-width="3"/>
  <polygon points="134,480 146,480 140,470" fill="#555"/>

  <!-- Bus rails -->
  <g stroke-width="3" fill="none">
    <line x1="240" y1="280" x2="960" y2="280" stroke="#d32f2f"/>
    <line x1="240" y1="320" x2="960" y2="320" stroke="#1976d2"/>
    <line x1="240" y1="360" x2="960" y2="360" stroke="#f9a825"/>
    <line x1="240" y1="400" x2="960" y2="400" stroke="#212121"/>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="966" y="284" fill="#d32f2f">3V3</text>
    <text x="966" y="324" fill="#1976d2">SDA</text>
    <text x="966" y="364" fill="#f9a825">SCL</text>
    <text x="966" y="404" fill="#212121">GND</text>
  </g>

  <!-- Boards above the rails: pins VIN x+30, SDA x+70, SCL x+110, GND x+150 -->
  <!-- BME688 -->
  <g>
    <rect x="300" y="60" width="180" height="130" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="390" y="86" text-anchor="middle" font-weight="bold" font-size="15" fill="#bf360c">BME688</text>
    <text x="390" y="104" text-anchor="middle" font-size="11">gas resistance (odor)</text>
    <text x="390" y="120" text-anchor="middle" font-size="11">I²C 0x77 (Adafruit)</text>
    <text x="390" y="136" text-anchor="middle" font-size="11">0x76 on Pimoroni boards</text>
    <g font-size="10" text-anchor="middle"><text x="330" y="182">VIN</text><text x="370" y="182">SDA</text><text x="410" y="182">SCL</text><text x="450" y="182">GND</text></g>
    <line x1="330" y1="190" x2="330" y2="280" stroke="#d32f2f" stroke-width="2"/>
    <line x1="370" y1="190" x2="370" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="410" y1="190" x2="410" y2="360" stroke="#f9a825" stroke-width="2"/>
    <line x1="450" y1="190" x2="450" y2="400" stroke="#212121" stroke-width="2"/>
    <circle cx="330" cy="280" r="5" fill="#d32f2f"/><circle cx="370" cy="320" r="5" fill="#1976d2"/>
    <circle cx="410" cy="360" r="5" fill="#f9a825"/><circle cx="450" cy="400" r="5" fill="#212121"/>
  </g>
  <!-- BNO085 -->
  <g>
    <rect x="530" y="60" width="180" height="130" rx="8" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
    <text x="620" y="86" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d47a1">BNO085 IMU</text>
    <text x="620" y="104" text-anchor="middle" font-size="11">yaw = device heading</text>
    <text x="620" y="120" text-anchor="middle" font-size="11">I²C 0x4A (0x4B alt)</text>
    <text x="620" y="136" text-anchor="middle" font-size="11">game rotation vector (no mag)</text>
    <g font-size="10" text-anchor="middle"><text x="560" y="182">VIN</text><text x="600" y="182">SDA</text><text x="640" y="182">SCL</text><text x="680" y="182">GND</text></g>
    <line x1="560" y1="190" x2="560" y2="280" stroke="#d32f2f" stroke-width="2"/>
    <line x1="600" y1="190" x2="600" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="640" y1="190" x2="640" y2="360" stroke="#f9a825" stroke-width="2"/>
    <line x1="680" y1="190" x2="680" y2="400" stroke="#212121" stroke-width="2"/>
    <circle cx="560" cy="280" r="5" fill="#d32f2f"/><circle cx="600" cy="320" r="5" fill="#1976d2"/>
    <circle cx="640" cy="360" r="5" fill="#f9a825"/><circle cx="680" cy="400" r="5" fill="#212121"/>
  </g>
  <!-- AS5600 -->
  <g>
    <rect x="760" y="60" width="180" height="130" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <text x="850" y="86" text-anchor="middle" font-weight="bold" font-size="15" fill="#4a148c">AS5600 + magnet</text>
    <text x="850" y="104" text-anchor="middle" font-size="11">wind vane angle · I²C 0x36</text>
    <text x="850" y="120" text-anchor="middle" font-size="11">6×2.5 mm diametric magnet</text>
    <text x="850" y="136" text-anchor="middle" font-size="11">≤ 3 mm above the chip</text>
    <g font-size="10" text-anchor="middle"><text x="790" y="182">VIN</text><text x="830" y="182">SDA</text><text x="870" y="182">SCL</text><text x="910" y="182">GND</text></g>
    <line x1="790" y1="190" x2="790" y2="280" stroke="#d32f2f" stroke-width="2"/>
    <line x1="830" y1="190" x2="830" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="870" y1="190" x2="870" y2="360" stroke="#f9a825" stroke-width="2"/>
    <line x1="910" y1="190" x2="910" y2="400" stroke="#212121" stroke-width="2"/>
    <circle cx="790" cy="280" r="5" fill="#d32f2f"/><circle cx="830" cy="320" r="5" fill="#1976d2"/>
    <circle cx="870" cy="360" r="5" fill="#f9a825"/><circle cx="910" cy="400" r="5" fill="#212121"/>
  </g>

  <!-- DRV2605L below the rails: its four wires drop in the free gap between the BME688 and BNO085 -->
  <g>
    <rect x="440" y="470" width="230" height="120" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <g font-size="9" text-anchor="middle"><text x="472" y="486">VIN</text><text x="497" y="486">SDA</text><text x="522" y="486">SCL</text><text x="547" y="486">GND</text></g>
    <text x="555" y="514" text-anchor="middle" font-weight="bold" font-size="15" fill="#880e4f">DRV2605L</text>
    <text x="555" y="532" text-anchor="middle" font-size="11">haptic motor driver · I²C 0x5A</text>
    <text x="555" y="548" text-anchor="middle" font-size="11">ERM mode, built-in effects</text>
    <text x="555" y="564" text-anchor="middle" font-size="11">or real-time playback</text>
    <line x1="472" y1="477" x2="472" y2="280" stroke="#d32f2f" stroke-width="2"/>
    <line x1="497" y1="477" x2="497" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="522" y1="477" x2="522" y2="360" stroke="#f9a825" stroke-width="2"/>
    <line x1="547" y1="477" x2="547" y2="400" stroke="#212121" stroke-width="2"/>
    <circle cx="472" cy="280" r="5" fill="#d32f2f"/><circle cx="497" cy="320" r="5" fill="#1976d2"/>
    <circle cx="522" cy="360" r="5" fill="#f9a825"/><circle cx="547" cy="400" r="5" fill="#212121"/>
    <!-- motor outputs -->
    <g font-size="10" text-anchor="end"><text x="666" y="500">MOTOR +</text><text x="666" y="584">MOTOR −</text></g>
    <line x1="670" y1="496" x2="760" y2="496" stroke="#7b1fa2" stroke-width="2.5"/>
    <line x1="760" y1="496" x2="760" y2="512" stroke="#7b1fa2" stroke-width="2.5"/>
    <line x1="670" y1="580" x2="760" y2="580" stroke="#7b1fa2" stroke-width="2.5"/>
    <line x1="760" y1="580" x2="760" y2="568" stroke="#7b1fa2" stroke-width="2.5"/>
  </g>
  <circle cx="760" cy="540" r="28" fill="#fffde7" stroke="#111" stroke-width="2"/>
  <text x="760" y="545" text-anchor="middle" font-weight="bold">M</text>
  <text x="798" y="530" font-size="11">vibration</text>
  <text x="798" y="544" font-size="11">motor disc</text>
  <text x="798" y="558" font-size="11">(ERM, 2–5 V)</text>

  <!-- Notes -->
  <g font-size="11" fill="#444">
    <text x="40" y="618">Wires that cross a rail without a dot are not connected. All four boards share one I²C bus: 0x36, 0x4A, 0x5A, 0x77.</text>
    <text x="40" y="634">Built physically as a daisy chain of STEMMA QT cables: Pi → BME688 → BNO085 → AS5600 → DRV2605L.</text>
    <text x="40" y="650">The DRV2605L drives the motor itself: no transistor, resistor or flyback diode. The Pi sends the cue patterns over I²C.</text>
    <text x="40" y="666">Generic (non-Adafruit) AS5600 boards: set them to 3.3 V and tie DIR to GND.</text>
    <text x="40" y="682">The BME688 address doesn't matter as long as it differs from the others; the driver will probe both.</text>
  </g>

  <!-- Legend -->
  <g font-size="11">
    <line x1="850" y1="430" x2="880" y2="430" stroke="#d32f2f" stroke-width="3"/><text x="886" y="434">3V3</text>
    <line x1="850" y1="448" x2="880" y2="448" stroke="#1976d2" stroke-width="3"/><text x="886" y="452">SDA (data)</text>
    <line x1="850" y1="466" x2="880" y2="466" stroke="#f9a825" stroke-width="3"/><text x="886" y="470">SCL (clock)</text>
    <line x1="850" y1="484" x2="880" y2="484" stroke="#212121" stroke-width="3"/><text x="886" y="488">GND</text>
    <line x1="850" y1="502" x2="880" y2="502" stroke="#7b1fa2" stroke-width="3"/><text x="886" y="506">motor drive</text>
  </g>
</svg>
